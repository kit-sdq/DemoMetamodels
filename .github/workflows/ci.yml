name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '35 2 * * *' # run nightly at 2:35 am

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # the build runs on the current LTS release, older ones verify that the bundling metamodels run on their minimum Java version
      - name: Set up JDKs
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: |
            8
            11
            25
          cache: 'maven'

      - name: Build and verify
        run: >
          ./mvnw clean verify
          --batch-mode
          --no-transfer-progress

      - name: Run JOANA tests on Java 8
        run: >
          ./mvnw failsafe:integration-test failsafe:verify
          --projects metamodels/joana
          --batch-mode
          --no-transfer-progress
          -Djvm=${JAVA_HOME_8_X64}/bin/java

      - name: Run confidentiality tests on Java 11
        run: >
          ./mvnw failsafe:integration-test failsafe:verify
          --projects metamodels/confidentiality4cbse
          --batch-mode
          --no-transfer-progress
          -Djvm=${JAVA_HOME_11_X64}/bin/java
